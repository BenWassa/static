name: Deploy Static to GitHub Pages

# Deploys the repository root (a dependency-free static site) to GitHub Pages.
# Enable once in repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/neurodivergent-mobile-site-r5txou
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site; index.html lives at the root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
